version: 2
updates:
  # Keep GitHub Actions used in workflows up to date. (The plugin has no
  # runtime dependencies — `obsidian` is host-provided and never bundled — so
  # npm only gets Dependabot *security* updates for the dev toolchain.)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
    target-branch: dev
